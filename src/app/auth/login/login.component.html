<div class="page container">
  <div class="form-card">
    <h1>Log in</h1>
    <p class="subtitle">New here? <a routerLink="/signup">Create an account</a></p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-field">
        <label for="login-mobile">Mobile number</label>
        <input id="login-mobile" type="tel" formControlName="mobile" autocomplete="username" />
      </div>

      <div class="form-field">
        <label for="login-password">Password</label>
        <input id="login-password" type="password" formControlName="password" autocomplete="current-password" />
      </div>

      @if (errorMessage()) {
        <p class="form-error">{{ errorMessage() }}</p>
      }

      <button type="submit" class="btn-primary" [disabled]="submitting()">
        {{ submitting() ? 'Logging in…' : 'Log in' }}
      </button>
    </form>
  </div>
</div>
