<div class="page container">
  <div class="form-card">
    <h1>Create your account</h1>
    <p class="subtitle">Already have an account? <a routerLink="/login">Log in</a></p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="name-row">
        <div class="form-field">
          <label for="signup-firstname">First name</label>
          <input id="signup-firstname" type="text" formControlName="firstName" autocomplete="given-name" />
        </div>
        <div class="form-field">
          <label for="signup-lastname">Last name</label>
          <input id="signup-lastname" type="text" formControlName="lastName" autocomplete="family-name" />
        </div>
      </div>

      <div class="form-field">
        <label for="signup-mobile">Mobile number</label>
        <input id="signup-mobile" type="tel" formControlName="mobile" autocomplete="username" />
      </div>

      <div class="form-field">
        <label for="signup-password">Password</label>
        <input id="signup-password" type="password" formControlName="password" autocomplete="new-password" />
      </div>

      @if (errorMessage()) {
        <p class="form-error">{{ errorMessage() }}</p>
      }

      <button type="submit" class="btn-primary" [disabled]="submitting()">
        {{ submitting() ? 'Creating account…' : 'Sign up' }}
      </button>
    </form>
  </div>
</div>
