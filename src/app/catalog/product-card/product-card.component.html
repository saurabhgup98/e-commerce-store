<article class="product-card">
  <a [routerLink]="['/products', product._id]" class="product-card__image">
    <span class="placeholder-thumb">{{ product.name.charAt(0) }}</span>
  </a>

  <div class="product-card__body">
    <a [routerLink]="['/products', product._id]" class="product-card__name">{{ product.name }}</a>
    <p class="product-card__price">{{ product.price | currency: 'INR' : 'symbol' : '1.0-0' }}</p>

    <div class="product-card__actions">
      <button type="button" class="icon-btn" [class.active]="favourites.isFavourite(product._id)" (click)="toggleFavourite()">
        {{ favourites.isFavourite(product._id) ? '♥ Favourited' : '♡ Favourite' }}
      </button>
      <button type="button" class="icon-btn" [class.active]="compare.isSelected(product._id)" (click)="toggleCompare()">
        {{ compare.isSelected(product._id) ? '✓ Comparing' : '+ Compare' }}
      </button>
    </div>

    @if (compareMessage()) {
      <p class="compare-message">{{ compareMessage() }}</p>
    }

    <button type="button" class="btn-primary add-to-cart" [disabled]="addingToCart()" (click)="addToCart()">
      {{ addingToCart() ? 'Adding…' : 'Add to cart' }}
    </button>
  </div>
</article>
